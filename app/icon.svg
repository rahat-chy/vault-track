<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background pill matching the app header -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="12" stroke="#818cf8" stroke-width="1.5" fill="none"/>
  <!-- Cardinal ticks -->
  <line x1="16" y1="4" x2="16" y2="7.5" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="24.5" y2="16" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="24.5" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="7.5" y2="16" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner face -->
  <circle cx="16" cy="16" r="6.5" stroke="#818cf8" stroke-width="1.2" fill="none"/>
  <!-- Dial hand pointing ~1 o'clock -->
  <line x1="16" y1="16" x2="18.3" y2="11.9" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center pivot -->
  <circle cx="16" cy="16" r="1.4" fill="#818cf8"/>
</svg>
